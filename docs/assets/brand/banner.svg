<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="bannerTitle bannerDesc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <title id="bannerTitle">Curso SQL Profesional — 102 apuntes de MySQL 8.0, uno por tema, con molde propio</title>
  <desc id="bannerDesc">A dark moss banner. A sprout mark sits on the left, the course name appears in large letter-spaced capitals, and a one-line tagline sits beneath it.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2C3424" />
      <stop offset="0.55" stop-color="#3A4430" />
      <stop offset="1" stop-color="#4C583E" />
    </linearGradient>
    <radialGradient id="glow" cx="0.14" cy="0" r="0.9">
      <stop offset="0" stop-color="#DADED8" stop-opacity="0.11" />
      <stop offset="1" stop-color="#DADED8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)" />
  <rect width="1200" height="320" fill="url(#glow)" />

  <!-- sprout mark, same geometry as leaf.svg at 4x -->
  <g transform="translate(76 52) scale(4)">
    <path d="M24 43V15" fill="none" stroke="#959581" stroke-width="2" stroke-linecap="round" />
    <path d="M24 28C14.8 28 9 22.2 9 13 18.2 13 24 18.8 24 28Z" fill="#768064" />
    <path d="M24 22C33.2 22 39 16.2 39 7 29.8 7 24 12.8 24 22Z" fill="#768064" />
  </g>

  <!-- edit these two lines only -->
  <text x="272" y="168" font-size="56" font-weight="700" fill="#DADED8" letter-spacing="3">CURSO SQL PROFESIONAL</text>
  <text x="274" y="212" font-size="23" fill="#959581">102 apuntes de MySQL 8.0, uno por tema, con molde propio.</text>

  <path d="M274 244H1150" stroke="#768064" stroke-opacity="0.35" stroke-width="1" />
</svg>
